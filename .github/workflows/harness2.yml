name: harness2-credential-free
on:
  pull_request:
    paths:
      - requirements-harness2.txt
      - scripts/check_harness2.py
      - scripts/propose_harness2.py
      - tests/test_harness2_source.py
      - .github/workflows/harness2.yml
  push:
    branches: [main]
    paths:
      - requirements-harness2.txt
      - scripts/check_harness2.py
      - scripts/propose_harness2.py
      - tests/test_harness2_source.py
      - .github/workflows/harness2.yml
permissions:
  contents: read
jobs:
  original-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read the original source pin
        id: upstream
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          from pathlib import Path
          from scripts.check_harness2 import pin
          print('sha=' + pin(Path.cwd()))
          PY
      - uses: actions/checkout@v4
        with:
          repository: google-research/harness2
          ref: ${{ steps.upstream.outputs.sha }}
          path: .dependencies/harness2
          persist-credentials: false
      - name: Install the complete pinned source distribution
        run: python -m pip install -r requirements-harness2.txt
      - name: Exercise source refusal controls
        run: python -m unittest discover -s tests -p test_harness2_source.py -v
      - name: Verify intact upstream and original CLIs and both demo modes
        run: python scripts/check_harness2.py --source .dependencies/harness2 --output "${{ runner.temp }}/harness2-demo"
      - name: Run original upstream workflow controls
        working-directory: .dependencies/harness2
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s tests -p test_workflow.py -v
      - name: Emit data-only experiment proposal
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: python -m scripts.propose_harness2 > "${{ runner.temp }}/proposal.json"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: harness2-experiment-v1
          path: ${{ runner.temp }}/proposal.json
          if-no-files-found: error
